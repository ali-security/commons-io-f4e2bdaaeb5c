language: java

cache:
  directories:
    - $HOME/.m2

jdk:
  - openjdk8
  - openjdk11
  - openjdk14
  - openjdk-ea
  - oraclejdk11

matrix:
  exclude:
    - jdk: openjdk-ea
  include:
    - jdk: openjdk-ea
      env: JACOCO_SKIP=true

# Travis' focal image no longer ships bellsoft-java14, so provision JDK 14 directly for that leg.
before_install:
  - if [ "$TRAVIS_JDK_VERSION" = "openjdk14" ]; then curl -sSL https://cdn.azul.com/zulu/bin/zulu14.29.23-ca-jdk14.0.2-linux_x64.tar.gz | tar xz -C $HOME; export JAVA_HOME=$HOME/zulu14.29.23-ca-jdk14.0.2-linux_x64; export PATH=$JAVA_HOME/bin:$PATH; java -version; fi

# --no-transfer-progress requires Maven 3.6.1+. Otherwise use --batch-mode
script:
  - mvn -V --no-transfer-progress -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dmaven.javadoc.skip=true -Djacoco.skip=true -Danimal.sniffer.skip=true
  - echo "Skipped tests (testcase, then skip reason):" && sed -n '/<testcase/h;/<skipped/{x;p;x;p}' target/surefire-reports/TEST-*.xml
  - |
    echo "Assumption-skipped tests and the assumption that skipped them:"
    for f in target/surefire-reports/TEST-*.xml; do sed -n '/<testcase/h;/<skipped message="Assumption failed/{x;p}' "$f"; done | sed -E 's/.*name="([^"]+)" classname="([^"]+)".*/\2 \1/' | while read -r cls m; do echo "$cls.$m skipped: $(grep -A6 "void $m(" "src/test/java/$(echo "$cls" | tr . /).java" | grep -m1 -o 'assume[A-Za-z]*(.*);')"; done
