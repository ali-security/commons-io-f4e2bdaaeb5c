name: Java CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [ 8, 11, 14 ]
        experimental: [false]
        include:
          - java: 15
            os: ubuntu-latest
            experimental: true
          - java: 15
            os: windows-latest
            experimental: true
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Build with Maven
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dmaven.javadoc.skip=true -Djacoco.skip=true -Danimal.sniffer.skip=true -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
        else
          mvn -V --file pom.xml --no-transfer-progress -DtrimStackTrace=false -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dmaven.javadoc.skip=true -Djacoco.skip=true -Danimal.sniffer.skip=true
        fi
    - name: Report skipped tests
      shell: bash
      run: |
        echo "Skipped tests (testcase, then skip reason):"
        sed -n '/<testcase/h;/<skipped/{x;p;x;p}' target/surefire-reports/TEST-*.xml
        echo "Assumption-skipped tests and the assumption that skipped them:"
        for f in target/surefire-reports/TEST-*.xml; do sed -n '/<testcase/h;/<skipped message="Assumption failed/{x;p}' "$f"; done | sed -E 's/.*name="([^"]+)" classname="([^"]+)".*/\2 \1/' | while read -r cls m; do echo "$cls.$m skipped: $(grep -A6 "void $m(" "src/test/java/$(echo "$cls" | tr . /).java" | grep -m1 -o 'assume[A-Za-z]*(.*);')"; done
    - name: Upload Maven build artifacts
      if: success() && matrix.os == 'ubuntu-latest' && matrix.java == 8
      uses: actions/upload-artifact@v4
      with:
        name: built-jars
        path: target/commons-io-*.jar
        if-no-files-found: error
